name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: make smoke
  nats-e2e:
    # BEL-207: live broker (JetStream) e2e for the NATS job consumer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install nats-py + nats-server
        run: |
          pip install nats-py
          curl -sL https://github.com/nats-io/nats-server/releases/download/v2.14.5/nats-server-v2.14.5-linux-amd64.tar.gz | tar xz
          sudo cp nats-server-v2.14.5-linux-amd64/nats-server /usr/local/bin/
      - name: NATS lab consumer e2e (skips are failures here)
        env:
          NATS_E2E_REQUIRED: "1"
        run: make nats-e2e

